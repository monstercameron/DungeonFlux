<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DungeonFlux</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { margin: 0; min-height: 100%; background: #10131b; color: #f3eee4; }
    body { display: grid; place-items: center; min-height: 100vh; }
    main { max-width: 42rem; padding: 2rem; text-align: center; }
    #status { opacity: .72; }
  </style>
</head>
<body>
  <main id="app"><p id="status">Loading DungeonFlux…</p></main>
  <script src="/wasm_exec.js"></script>
  <script>
    (async function () {
      const status = document.getElementById("status");
      try {
        const go = new Go();
        const result = await WebAssembly.instantiateStreaming(
          fetch("/app/dungeonflux.wasm"), go.importObject);
        go.run(result.instance);
      } catch (error) {
        status.textContent = "DungeonFlux could not start.";
        console.error(error);
      }
    }());
  </script>
</body>
</html>
