syntax = "proto3";

package spike.v1;

option go_package = "github.com/monstercameron/DungeonFlux/scripts/spike/gen/spike/v1;spikev1";

service Echo {
  rpc Stream(stream AudioChunk) returns (stream AudioChunk);
}

message AudioChunk {
  uint64 sequence = 1;
  uint32 sample_rate = 2;
  bytes pcm_s16le = 3;
  bool final = 4;
}
