name: Race tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race tests
        run: go test -race ./internal/runtime/... ./internal/api/... ./internal/voice/...
